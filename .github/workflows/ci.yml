name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  test-build:
    name: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        run: npm test

      - name: Build Chrome package
        run: npm run build:chrome

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: yt-ultrawide-chrome
          path: dist/yt-ultrawide-v*.zip
          if-no-files-found: error

  safari-convert:
    name: safari-convert
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert shared extension to a Safari Web Extension
        run: npm run build:safari

      - name: Upload Safari project
        uses: actions/upload-artifact@v4
        with:
          name: yt-ultrawide-safari
          path: dist/safari
          if-no-files-found: error
