name: Release

# Tag a commit on master with a version (e.g. v1.0.0) to build the store
# package and publish it as a GitHub Release with the zip attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        run: npm test

      - name: Build extension zip
        run: npm run build

      - name: Publish GitHub Release with the store zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" yt-ultrawide-v*.zip --title "${{ github.ref_name }}" --generate-notes
